schema_version: 1

context:
  name: crccheck
  version: "1.3.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/crccheck-${{ version }}.tar.gz
  sha256: 1544c0110bf0a697d875d4f29dc40d7079f9d4d402a9317383f55f90ca72563a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - crccheck
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Calculation library for CRCs and checksums
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://sourceforge.net/projects/crccheck/
  documentation: https://pythonhosted.org/crccheck/

extra:
  recipe-maintainers:
    - jan-janssen
